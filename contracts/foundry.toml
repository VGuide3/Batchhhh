[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 1000000
via_ir = true
evm_version = "prague"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./test/fixtures" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
